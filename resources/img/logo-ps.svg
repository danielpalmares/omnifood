<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer yellow ring -->
  <circle cx="100" cy="100" r="97" fill="#f5c518"/>
  <!-- Black inner circle -->
  <circle cx="100" cy="100" r="80" fill="#111111"/>
  <!-- P letter -->
  <text x="18" y="140" font-family="Impact, 'Arial Black', sans-serif" font-size="100" font-weight="900" fill="#f5c518">P</text>
  <!-- S letter (darker/shadow effect) -->
  <text x="95" y="140" font-family="Impact, 'Arial Black', sans-serif" font-size="100" font-weight="900" fill="#555555">S</text>
  <!-- ACADEMIA arc text -->
  <path id="topArc" fill="none" d="M 24 100 A 76 76 0 0 1 176 100"/>
  <text>
    <textPath href="#topArc" startOffset="9%" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f5c518" letter-spacing="4">ACADEMIA</textPath>
  </text>
  <!-- PHYSICAL SPACE bottom text -->
  <text x="100" y="170" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="13" fill="#f5c518" letter-spacing="3">PHYSICAL</text>
  <text x="100" y="186" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="13" fill="#f5c518" letter-spacing="3">SPACE</text>
</svg>
